name: Build Windows installer and portable preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version (for example 0.1.0-preview.2)
        required: true
        default: 0.1.0-preview.2

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Core regression tests
        run: dotnet test tests/NyKurEdge.Core.Tests/NyKurEdge.Core.Tests.csproj -c Release --disable-build-servers
      - name: Build self-contained portable payload
        shell: pwsh
        run: ./tools/release/Build-Portable.ps1 -Version $env:RELEASE_VERSION -SkipRuntimeCheck
      - name: Obtain verified Inno Setup toolchain
        shell: pwsh
        run: ./tools/release/Get-InnoSetup.ps1
      - name: Build per-user EXE installer
        shell: pwsh
        run: ./tools/release/Build-Installer.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: nykur-edge-windows-preview
          path: |
            artifacts/releases/*/*-Setup-x64.exe
            artifacts/releases/*/*.zip
            artifacts/releases/*/SHA256SUMS.txt
            artifacts/releases/*/release.json
            artifacts/releases/*/installer-payload-manifest.txt
          if-no-files-found: error
